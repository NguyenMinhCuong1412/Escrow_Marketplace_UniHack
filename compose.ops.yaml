# Ops Shared Marketplace Server Docker Compose
# Tách biệt hoàn toàn:
#   - init-ops-secrets: sinh riêng ATTEST_API_KEY, OPS_JWT_SECRET, SESSION_SECRET (0600) và tách file cho backend vs hosted frontend
#   - backend: Keyless Public API (ENABLE_SHARED_AUTH=true, PINATA_JWT, KHÔNG giữ AGENT_PRIVATE_KEY)
#   - agent-worker: Worker cô lập giữ AGENT_PRIVATE_KEY, dùng chung SQLite WAL (ops_backend_data:/data)
#   - frontend (profile: ["hosted-ui"]): Web UI hosted tùy chọn, chạy Shared Auth qua http://backend:8000,
#     không chứa bất kỳ Ops secret nào; SESSION_SECRET riêng trên volume ops_hosted_ui_secrets
#   - backend & frontend chỉ publish trên 127.0.0.1 (đặt sau Caddy Auto-TLS, xem docker/Caddyfile.ops.example)
# Lưu ý bảo mật: Tuyệt đối KHÔNG đặt ví Owner/Arbiter (0xCa76...39Eb) trong bất kỳ env hoặc container nào.

services:
  init-ops-secrets:
    image: python:3.12-slim
    volumes:
      - ./docker/init_secrets.py:/init_secrets.py:ro
      - ops_backend_secrets:/run/secrets-env
      - ops_frontend_secrets:/run/frontend-secrets
    environment:
      SECRETS_FILE: /run/secrets-env/secrets.env
      FRONTEND_SECRETS_FILE: /run/frontend-secrets/secrets.env
      OPS_SPLIT_SECRETS: "true"
      INIT_OPS_JWT_SECRET: "true"
      SESSION_SECRET: ${SESSION_SECRET:-}
      ATTEST_API_KEY: ${ATTEST_API_KEY:-}
      OPS_JWT_SECRET: ${OPS_JWT_SECRET:-}
    command: ["python", "/init_secrets.py"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      init-ops-secrets:
        condition: service_completed_successfully
    ports:
      # P4-C1: chỉ bind loopback để Docker iptables không vượt ufw; truy cập công khai qua Caddy (api.<domain>)
      - "${OPS_BIND_IP:-127.0.0.1}:${OPS_API_PORT:-8000}:8000"
    environment:
      RPC_URL: ${RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}
      CHAIN_ID: ${CHAIN_ID:-43113}
      ESCROW_ADDRESS: ${ESCROW_ADDRESS:-0x19D053c84941411888f5b9e40c854365fdd4eb00}
      DATA_DIR: /data
      ALLOW_LOCAL_HOSTS: ${ALLOW_LOCAL_HOSTS:-false}
      ENFORCE_EVIDENCE_HASH: ${ENFORCE_EVIDENCE_HASH:-true}
      VERIFY_CHAIN_BEFORE_TTL_RELEASE: ${VERIFY_CHAIN_BEFORE_TTL_RELEASE:-true}
      REQUIRE_PROXY_SIGNATURE: ${REQUIRE_PROXY_SIGNATURE:-true}
      ENABLE_SHARED_AUTH: "true"
      OPS_JWT_SECRET: ${OPS_JWT_SECRET:-}
      OPS_AUTH_ALLOWED_ORIGINS: ${OPS_AUTH_ALLOWED_ORIGINS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      IPFS_GATEWAY: ${IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs/}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      PINATA_JWT: ${PINATA_JWT:-}
      PINATA_URL: ${PINATA_URL:-https://api.pinata.cloud/pinning/pinFileToIPFS}
      TRUST_PROXY_FORWARDED_FOR: ${TRUST_PROXY_FORWARDED_FOR:-false}
      TRADE_INDEX_ENABLED: ${TRADE_INDEX_ENABLED:-true}
      AGENT_AUTO: "false"
      ATTEST_API_KEY: ${ATTEST_API_KEY:-}
    volumes:
      - ops_backend_data:/data
      - ops_backend_secrets:/run/secrets-env:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; d=json.loads(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()); assert 'tesseract' in d and d.get('ops_auth_enabled') and d.get('ops_jwt_configured') and not d.get('agent_signer_configured')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  agent-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      init-ops-secrets:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    command: ["python", "worker.py"]
    environment:
      RPC_URL: ${RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}
      CHAIN_ID: ${CHAIN_ID:-43113}
      ESCROW_ADDRESS: ${ESCROW_ADDRESS:-0x19D053c84941411888f5b9e40c854365fdd4eb00}
      DATA_DIR: /data
      ALLOW_LOCAL_HOSTS: ${ALLOW_LOCAL_HOSTS:-false}
      ENFORCE_EVIDENCE_HASH: ${ENFORCE_EVIDENCE_HASH:-true}
      VERIFY_CHAIN_BEFORE_TTL_RELEASE: ${VERIFY_CHAIN_BEFORE_TTL_RELEASE:-true}
      REQUIRE_PROXY_SIGNATURE: ${REQUIRE_PROXY_SIGNATURE:-true}
      IPFS_GATEWAY: ${IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs/}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      AGENT_PRIVATE_KEY: ${WORKER_AGENT_PRIVATE_KEY:-${AGENT_PRIVATE_KEY:-}}
      AGENT_POLL_SECONDS: ${AGENT_POLL_SECONDS:-5}
      RECONCILE_POLL_SECONDS: ${RECONCILE_POLL_SECONDS:-10}
      WORKER_LEASE_TTL_SECONDS: ${WORKER_LEASE_TTL_SECONDS:-60}
      TRADE_INDEX_ENABLED: ${TRADE_INDEX_ENABLED:-true}
      ATTEST_API_KEY: ${ATTEST_API_KEY:-}
    volumes:
      - ops_backend_data:/data
      - ops_backend_secrets:/run/secrets-env:ro
    restart: unless-stopped

  frontend:
    profiles: ["hosted-ui"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-43113}
        NEXT_PUBLIC_ESCROW_ADDRESS: ${NEXT_PUBLIC_ESCROW_ADDRESS:-0x19D053c84941411888f5b9e40c854365fdd4eb00}
        NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS:-0xD0c99809e2F035Bf9d99cCB0593A9cc4B6411F78}
        NEXT_PUBLIC_DEPLOY_BLOCK: ${NEXT_PUBLIC_DEPLOY_BLOCK:-60980241}
        NEXT_PUBLIC_BACKEND_URL: /_backend
        NEXT_PUBLIC_IPFS_GATEWAY: ${NEXT_PUBLIC_IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs/}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-3a8170812b534d0ff9d794f19a901d64}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # P4-C1: chỉ bind loopback; truy cập công khai qua Caddy (app.<domain>)
      - "${OPS_UI_BIND_IP:-127.0.0.1}:${OPS_UI_PORT:-3000}:3000"
    environment:
      CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-43113}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-43113}
      NEXT_PUBLIC_ESCROW_ADDRESS: ${NEXT_PUBLIC_ESCROW_ADDRESS:-0x19D053c84941411888f5b9e40c854365fdd4eb00}
      NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS:-0xD0c99809e2F035Bf9d99cCB0593A9cc4B6411F78}
      NEXT_PUBLIC_DEPLOY_BLOCK: ${NEXT_PUBLIC_DEPLOY_BLOCK:-60980241}
      NEXT_PUBLIC_BACKEND_URL: /_backend
      NEXT_PUBLIC_IPFS_GATEWAY: ${NEXT_PUBLIC_IPFS_GATEWAY:-https://gateway.pinata.cloud/ipfs/}
      # P4-C1: Hosted UI dùng Shared Auth (Ops JWT) qua mạng Docker nội bộ;
      # tuyệt đối không nhận ATTEST_API_KEY, OPS_JWT_SECRET, PINATA_JWT, AGENT_PRIVATE_KEY hay SESSION_SECRET từ .env.
      BFF_AUTH_MODE: shared
      SHARED_API_URL: http://backend:8000
      CLIENT_SECRETS_FILE: /run/client-secrets/session.env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRADE_INDEX_ENABLED: ${TRADE_INDEX_ENABLED:-true}
    volumes:
      # SESSION_SECRET riêng, tự sinh 0600 trong 0700 và bền vững qua restart/recreate
      - ops_hosted_ui_secrets:/run/client-secrets
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  ops_backend_data:
  ops_backend_secrets:
  ops_frontend_secrets:
  ops_hosted_ui_secrets:
