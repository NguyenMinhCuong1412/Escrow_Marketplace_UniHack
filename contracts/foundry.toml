[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[invariant]
fail_on_revert = true
runs = 256
depth = 200

[fuzz]
runs = 512

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
